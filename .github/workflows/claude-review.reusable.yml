name: claude-review (reusable)

# Reusable independent AI review. Call via
# `uses: Per-Paulsen/ci-workflows/.github/workflows/claude-review.reusable.yml@v1`
# with `secrets: inherit`. Non-blocking.
#
# Auth, in order of preference:
#   1. CLAUDE_CODE_OAUTH_TOKEN (repo secret): bills the review against the Claude
#      subscription's dedicated programmatic monthly credit instead of pay-per-use
#      API tokens. Created once via `claude setup-token`.
#   2. ANTHROPIC_API_KEY (repo secret): pay-per-use fallback. Runs when no OAuth
#      token is configured, or when the subscription-credit attempt failed (e.g.
#      monthly credit exhausted, token expired).
# With neither secret set, the job no-ops cleanly.
# Accepted trade-off: the failure signal cannot distinguish WHY the OAuth attempt
# failed, so an OAuth run that fails after already posting comments triggers a
# paid re-review with possibly duplicate comments. Rare, and preferred over
# silently losing reviews when the monthly credit runs out.
# Secrets are passed ONLY via `with:` to the action, never as job env: job env
# would put them in every step's process tree, including the reviewer's own
# allowed Bash, where a prompt-injected PR could exfiltrate them into a comment.
# The action mints its own GitHub token via OIDC; the Claude GitHub App is NOT
# needed for this automatic PR review (only for interactive @claude mentions).

on:
  workflow_call: {}

jobs:
  review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # claude-code-action mints its GitHub token via OIDC; required
    env:
      # Presence flags only; the secret VALUES stay out of the job env (see header).
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      # Shared review config for both auth paths (GitHub Actions has no YAML anchors).
      # No turn cap: a capped reviewer dies mid-read on large PRs while the check
      # stays green (2026-08-03 incident, per-claude-skills PR 2). No numeric limits
      # without an explicit decision.
      # allowedTools per the official pr-review example: without it the reviewer
      # is DENIED the comment-posting tools and silently posts nothing (same
      # incident; permission_denials in the run log). Read/Grep/Glob added
      # 2026-08-04 (per-claude-skills PR 3): they were never in the list, so the
      # checked-out repo was unreadable and the diff was the de-facto boundary
      # (14 permission denials in that run's log).
      REVIEW_CLAUDE_ARGS: |
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
      REVIEW_PROMPT: |
        You are reviewing this pull request as an INDEPENDENT reviewer with fresh
        context. The code may have been written by an AI agent; do not assume it is
        correct. Catch what the author (human or AI) missed.

        Priorities, highest first:
        1. Correctness & logic bugs: wrong conditions, unhandled error paths, race
           conditions, broken edge cases, incorrect async/await.
        2. Security: injection, missing auth checks, secret/PII exposure, unsafe
           deserialization.
        3. Adherence to this repo's conventions in CLAUDE.md and any specs/.
        4. Missing or weak test coverage for the changed behavior.

        Rules:
        - You CANNOT run the code; tests/build are the real gates. Flag suspected
          runtime issues but mark them unverified.
        - The diff is the starting point, not the boundary: read any repo file
          (Read/Grep/Glob) the change touches or relies on.
        - Be concise and high-signal. Skip pure style nits (linters handle those).
        - Only flag real issues. For each finding: file:line, severity
          (blocker/important/minor), the problem, a concrete fix. Use inline
          comments where possible.
        - ALWAYS finish by posting an overall verdict as a PR comment via
          "gh pr comment": findings worst-first plus a closing verdict, or, when
          the PR is clean, a brief comment saying so and what you checked. A
          review that posts nothing is a failed review; your final text is not
          visible anywhere.
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
      - name: Mark review run start
        if: env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true'
        run: echo "REVIEW_RUN_START=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Claude review (subscription credit)
        id: review_oauth
        if: env.HAS_OAUTH == 'true'
        # Advisory: never fail the job. The action exits non-zero on its workflow-validation
        # check for PRs that modify the workflow file; review comments are the real output.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ env.REVIEW_CLAUDE_ARGS }}
          prompt: ${{ env.REVIEW_PROMPT }}
      - name: Claude review (API key fallback)
        if: (env.HAS_OAUTH == 'false' || steps.review_oauth.outcome == 'failure') && env.HAS_KEY == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: ${{ env.REVIEW_CLAUDE_ARGS }}
          prompt: ${{ env.REVIEW_PROMPT }}
      # Machine evidence contract (2026-08-04): the reviewer's discipline is a
      # prompt and therefore not a guarantee. This deterministic step enforces
      # the contract instead: after every run there must be a review artifact
      # on the PR (comment, inline comment, or review object). It always posts
      # an evidence log (what the agent actually did: turns, files read, diff
      # fetched, denials, cost, auth path). If no artifact exists, it
      # rescue-posts the agent's otherwise-invisible final text and FAILS the
      # job: red means "review infrastructure broke its contract", never "the
      # code is bad". Known no-op cases stay green and documented: PRs that
      # modify workflow files (the action's own security validation) get a
      # notice comment; missing secrets never reach this step.
      - name: Verify review evidence
        if: env.HAS_OAUTH == 'true' || env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTH_PATH: ${{ env.HAS_OAUTH == 'true' && 'subscription-oauth' || 'api-key' }}
        run: |
          set -u
          REPO="$GITHUB_REPOSITORY"
          PR="${PR_NUMBER:-}"
          [ -n "$PR" ] || { echo "no PR context; nothing to verify"; exit 0; }
          SINCE="$REVIEW_RUN_START"
          RUN_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"

          # 1. Review artifacts since run start (author matching "claude").
          ic=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq "[.[] | select((.user.login|test(\"claude\";\"i\")) and .created_at >= \"$SINCE\")] | length" 2>/dev/null || echo 0)
          rc=$(gh api "repos/$REPO/pulls/$PR/comments" --paginate --jq "[.[] | select((.user.login|test(\"claude\";\"i\")) and .created_at >= \"$SINCE\")] | length" 2>/dev/null || echo 0)
          rv=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq "[.[] | select((.user.login|test(\"claude\";\"i\")) and (.submitted_at // \"\") >= \"$SINCE\")] | length" 2>/dev/null || echo 0)
          total=$((ic + rc + rv))

          # 2. Activity metrics from the agent execution log (best effort).
          EXEC=$(find /home/runner/work/_temp -maxdepth 2 -name 'claude-execution-output.json' 2>/dev/null | head -1)
          turns=na; denials=na; cost=na; reads=na; diff_fetched=na
          if [ -n "$EXEC" ] && [ -f "$EXEC" ]; then
            turns=$(jq -r '[.[] | select(.type=="result")] | last | .num_turns // "na"' "$EXEC" 2>/dev/null || echo na)
            denials=$(jq -r '[.[] | select(.type=="result")] | last | .permission_denials_count // "na"' "$EXEC" 2>/dev/null || echo na)
            cost=$(jq -r '[.[] | select(.type=="result")] | last | .total_cost_usd // "na"' "$EXEC" 2>/dev/null || echo na)
            reads=$(jq -r '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="tool_use" and .name=="Read")] | length' "$EXEC" 2>/dev/null || echo na)
            dcount=$(jq -r '[.[] | select(.type=="assistant") | .message.content[]? | select(.type=="tool_use" and .name=="Bash") | (.input.command // "") | select(test("gh pr diff"))] | length' "$EXEC" 2>/dev/null || echo 0)
            case "$dcount" in (0) diff_fetched=no ;; (na) diff_fetched=na ;; (*) diff_fetched=yes ;; esac
          fi

          evidence="### Claude review evidence ([run]($RUN_URL))
          Artifacts since run start: $ic PR comment(s), $rc inline comment(s), $rv review object(s).
          Activity: $turns turns, $reads file(s) read, diff fetched: $diff_fetched, $denials permission denial(s), cost USD $cost, auth: $AUTH_PATH."

          if [ "$total" -gt 0 ]; then
            gh pr comment "$PR" --repo "$REPO" --body "$evidence" || true
            echo "review evidence ok ($total artifact(s))"; exit 0
          fi

          # 3. Legitimate no-op: PRs modifying workflow files (action security validation).
          wf_pr=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '[.[] | select(.filename | startswith(".github/workflows/"))] | length' 2>/dev/null || echo 0)
          if [ "$wf_pr" -gt 0 ]; then
            gh pr comment "$PR" --repo "$REPO" --body "Claude review skipped: this PR modifies workflow files, so the review action no-ops as a security validation.

          $evidence" || true
            echo "workflow-file PR; documented no-op"; exit 0
          fi

          # 4. Contract broken: rescue-post the agent's final text, then fail.
          final=""
          if [ -n "$EXEC" ] && [ -f "$EXEC" ]; then
            final=$(jq -r '[.[] | select(.type=="assistant")] | last | .message.content[]? | select(.type=="text") | .text' "$EXEC" 2>/dev/null | head -c 60000 || true)
          fi
          {
            echo "**Review contract broken: the reviewer posted no verdict itself.** This check goes red for that reason; red means infrastructure failure, not a code verdict."
            echo
            echo "$evidence"
            if [ -n "$final" ]; then
              echo
              echo "Rescue-posted final text of the reviewer:"
              echo
              echo "$final"
            fi
          } > /tmp/review-rescue.md
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/review-rescue.md || true
          echo "::error::Claude review posted no artifact; rescue comment posted, failing the evidence check."
          exit 1
